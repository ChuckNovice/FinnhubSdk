name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write  # Required for creating tags and releases

jobs:
  # Job 1: Create and push tag when merging to main (not on tag push)
  create-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_created: ${{ steps.create_tag.outputs.tag_created }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Fetch all tags
      run: git fetch --tags origin

    - name: Determine Version
      id: version
      run: |
        # Get the latest release tag (not pre-release) sorted by version
        # Filter to only vX.Y.Z tags (no -beta suffix)
        LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v '-' | head -n1)

        if [ -z "$LATEST_TAG" ]; then
          LATEST_VERSION="0.0.0"
          echo "No release tags found, starting from 0.0.0"
        else
          LATEST_VERSION=${LATEST_TAG#v}
          echo "Latest release tag: $LATEST_TAG (version: $LATEST_VERSION)"
        fi

        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

        # Increment patch version for automatic releases
        PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Check if tag exists
      id: check_tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "Tag v$VERSION already exists"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "Tag v$VERSION does not exist"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      id: create_tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push origin "v$VERSION"
        echo "tag_created=true" >> $GITHUB_OUTPUT
        echo "Created and pushed tag v$VERSION"

  # Job 2: Build, publish, and create release
  # Runs after create-tag on main push, OR directly on manual tag push
  publish:
    needs: [create-tag]
    if: always() && (needs.create-tag.outputs.tag_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test --no-build -c Release

    - name: Determine Version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # Direct tag push - use tag name
          VERSION="${{ github.ref_name }}"
        else
          # Main branch push - use version from create-tag job
          VERSION="v${{ needs.create-tag.outputs.version }}"
        fi
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Pack NuGet Package
      run: dotnet pack src/FinnhubSdk/FinnhubSdk.csproj --no-build -c Release -o ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Push to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-release
        path: ./artifacts/*.nupkg

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        name: v${{ steps.version.outputs.version }}
        tag_name: v${{ steps.version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
