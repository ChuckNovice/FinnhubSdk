name: Pre-Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write  # Required for creating tags and releases

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test --no-build -c Release

    - name: Fetch all tags
      run: git fetch --tags origin

    - name: Determine Pre-release Version
      id: version
      run: |
        # Get the latest release tag (not pre-release) sorted by version
        # Filter to only vX.Y.Z tags (no -beta suffix)
        LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v '-' | head -n1)

        if [ -z "$LATEST_TAG" ]; then
          VERSION="1.0.0"
          echo "No release tags found, using default: $VERSION"
        else
          VERSION=${LATEST_TAG#v}
          echo "Latest release tag: $LATEST_TAG (version: $VERSION)"
        fi

        # Add pre-release suffix with short commit SHA for uniqueness
        SHORT_SHA=$(git rev-parse --short HEAD)
        PRE_VERSION="${VERSION}-beta.${SHORT_SHA}"
        echo "version=$PRE_VERSION" >> $GITHUB_OUTPUT
        echo "Publishing pre-release version: $PRE_VERSION"

    - name: Pack NuGet Package (Pre-release)
      run: |
        dotnet pack src/FinnhubSdk/FinnhubSdk.csproj --no-build -c Release -o ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Push to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-prerelease
        path: ./artifacts/*.nupkg

    - name: Create Pre-release Tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Delete existing tag if it exists (allows re-running)
        git tag -d "v$VERSION" 2>/dev/null || true
        git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
        # Create new tag
        git tag -a "v$VERSION" -m "Pre-release v$VERSION"
        git push origin "v$VERSION"
        echo "Created tag v$VERSION"

    - name: Create GitHub Pre-release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        name: v${{ steps.version.outputs.version }} (Beta)
        tag_name: v${{ steps.version.outputs.version }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
