name: Pre-Release

on:
  push:
    branches: [ develop ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test --no-build -c Release

    - name: Pack NuGet Package (Pre-release)
      run: |
        # Get version from git tags or default to 1.0.0
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
        # Strip 'v' prefix if present
        VERSION=${VERSION#v}
        # Add pre-release suffix with commit count
        COMMIT_COUNT=$(git rev-list --count HEAD)
        PRE_VERSION="${VERSION}-beta.${COMMIT_COUNT}"
        echo "Publishing version: $PRE_VERSION"
        dotnet pack src/FinnhubSdk/FinnhubSdk.csproj --no-build -c Release -o ./artifacts -p:PackageVersion=$PRE_VERSION

    - name: Push to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-prerelease
        path: ./artifacts/*.nupkg
